<svg role="img" aria-label="Illustrative downtrend candle sequence" viewBox="0 0 160 60" xmlns="http://www.w3.org/2000/svg">
              <!-- c1 red small, balanced wicks -->
              <line x1="16"  y1="4"  x2="16"  y2="14" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="11"    y="8"  width="10" height="4"  fill="#c62828" rx="1"/>
              <!-- c2 red medium, long upper wick (resistance test) -->
              <line x1="32"  y1="10" x2="32"  y2="22" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="27"    y="14" width="10" height="6"  fill="#c62828" rx="1"/>
              <!-- c3 green small bounce -->
              <line x1="48"  y1="14" x2="48"  y2="21" stroke="#2d8c3c" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="43"    y="16" width="10" height="4"  fill="#2d8c3c" rx="1"/>
              <!-- c4 red big breakdown -->
              <line x1="64"  y1="18" x2="64"  y2="36" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="59"    y="20" width="10" height="14" fill="#c62828" rx="1"/>
              <!-- c5 green doji-like, long lower wick (failed reversal) -->
              <line x1="80"  y1="28" x2="80"  y2="40" stroke="#2d8c3c" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="75"    y="31" width="10" height="3"  fill="#2d8c3c" rx="1"/>
              <!-- c6 red medium continuation -->
              <line x1="96"  y1="31" x2="96"  y2="42" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="91"    y="33" width="10" height="7"  fill="#c62828" rx="1"/>
              <!-- c7 green small bounce -->
              <line x1="112" y1="36" x2="112" y2="44" stroke="#2d8c3c" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="107"   y="38" width="10" height="4"  fill="#2d8c3c" rx="1"/>
              <!-- c8 red strong push -->
              <line x1="128" y1="38" x2="128" y2="52" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="123"   y="40" width="10" height="10" fill="#c62828" rx="1"/>
              <!-- c9 red with long lower wick (probing lower) -->
              <line x1="144" y1="42" x2="144" y2="54" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="139"   y="44" width="10" height="8"  fill="#c62828" rx="1"/>
            </svg>

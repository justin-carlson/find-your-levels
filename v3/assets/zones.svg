            <line class="wick-down" x1="118" y1="154" x2="118" y2="205" stroke-width="1.7" stroke-linecap="square" />
            <rect class="candle-down" x="111" y="166" width="14" height="30" />
            <line class="wick-up" x1="140" y1="156" x2="140" y2="198" stroke-width="1.7" stroke-linecap="square" />
            <rect class="candle-up" x="133" y="172" width="14" height="16" />
            <line class="wick-down" x1="158" y1="160" x2="158" y2="194" stroke-width="1.7" stroke-linecap="square" />

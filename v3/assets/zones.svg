<svg class="chart-svg" viewBox="0 0 760 320" role="img" aria-labelledby="dbr-rbd-title dbr-rbd-desc" xmlns="http://www.w3.org/2000/svg">
            <title id="dbr-rbd-title">Demand zone and supply zone chart example</title>
            <desc id="dbr-rbd-desc">Two side-by-side candlestick charts. The left chart shows a drop, a small base highlighted as a demand zone, then a rally. The right chart shows a rally, a small base highlighted as a supply zone, then a drop.</desc>
            <rect x="1" y="1" width="758" height="318" rx="8" fill="transparent" />
            <text class="chart-title" x="40" y="34">Demand zone - Drop, Base, Rally</text>
            <text class="chart-title" x="420" y="34">Supply zone - Rally, Base, Drop</text>

            <rect x="24" y="50" width="332" height="216" rx="8" fill="transparent" stroke="rgba(0,0,0,0.08)" />
            <rect x="404" y="50" width="332" height="216" rx="8" fill="transparent" stroke="rgba(0,0,0,0.08)" />

            <g aria-hidden="true">
              <line class="chart-grid" x1="40" y1="90" x2="340" y2="90" />
              <line class="chart-grid" x1="40" y1="130" x2="340" y2="130" />
              <line class="chart-grid" x1="40" y1="170" x2="340" y2="170" />
              <line class="chart-grid" x1="40" y1="210" x2="340" y2="210" />
              <text class="price-label" x="306" y="98">$4.10</text>
              <text class="price-label" x="306" y="138">$3.90</text>
              <text class="price-label" x="306" y="178">$3.70</text>
              <text class="price-label" x="306" y="218">$3.50</text>

              <line class="chart-grid" x1="420" y1="90" x2="720" y2="90" />
              <line class="chart-grid" x1="420" y1="130" x2="720" y2="130" />
              <line class="chart-grid" x1="420" y1="170" x2="720" y2="170" />
              <line class="chart-grid" x1="420" y1="210" x2="720" y2="210" />
              <text class="price-label" x="686" y="98">$4.10</text>
              <text class="price-label" x="686" y="138">$3.90</text>
              <text class="price-label" x="686" y="178">$3.70</text>
              <text class="price-label" x="686" y="218">$3.50</text>
            </g>

            <rect class="zone-demand" x="128" y="150" width="76" height="48" rx="3" stroke="none" />
            <text class="chart-label label-green" x="169" y="217" text-anchor="middle">Demand zone</text>

            <line class="wick-down" x1="64" y1="78" x2="64" y2="124" stroke-width="1.7" stroke-linecap="square" />
            <rect class="candle-down" x="57" y="88" width="14" height="28" />
            <line class="wick-down" x1="82" y1="104" x2="82" y2="146" stroke-width="1.7" stroke-linecap="square" />
            <rect class="candle-down" x="75" y="116" width="14" height="24" />
            <line class="wick-down" x1="100" y1="122" x2="100" y2="172" stroke-width="1.7" stroke-linecap="square" />

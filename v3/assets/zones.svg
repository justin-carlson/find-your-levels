            <line class="wick-down" x1="518" y1="94" x2="518" y2="138" stroke-width="1.7" stroke-linecap="square" />
            <rect class="candle-down" x="511" y="104" width="14" height="24" />
            <line class="wick-up" x1="536" y1="96" x2="536" y2="134" stroke-width="1.7" stroke-linecap="square" />

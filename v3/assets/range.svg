<svg role="img" aria-label="Illustrative range candle sequence" viewBox="0 0 160 60" xmlns="http://www.w3.org/2000/svg">
              <!-- Range boundaries -->
              <line x1="2" y1="10" x2="152" y2="10" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/>
              <line x1="2" y1="50" x2="152" y2="50" stroke="#bbb" stroke-width="1" stroke-dasharray="3 3"/>
              <!-- c1 red big rejection at top -->
              <line x1="16"  y1="10" x2="16"  y2="28" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="11"    y="12" width="10" height="14" fill="#c62828" rx="1"/>
              <!-- c2 green strong bounce from bottom -->
              <line x1="32"  y1="26" x2="32"  y2="48" stroke="#2d8c3c" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="27"    y="28" width="10" height="16" fill="#2d8c3c" rx="1"/>
              <!-- c3 red small -->
              <line x1="48"  y1="20" x2="48"  y2="32" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="43"    y="22" width="10" height="8"  fill="#c62828" rx="1"/>
              <!-- c4 green medium -->
              <line x1="64"  y1="28" x2="64"  y2="44" stroke="#2d8c3c" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="59"    y="30" width="10" height="12" fill="#2d8c3c" rx="1"/>
              <!-- c5 red long upper wick (rejection attempt) -->
              <line x1="80"  y1="11" x2="80"  y2="24" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="75"    y="16" width="10" height="6"  fill="#c62828" rx="1"/>
              <!-- c6 red continuation -->
              <line x1="96"  y1="22" x2="96"  y2="36" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="91"    y="24" width="10" height="10" fill="#c62828" rx="1"/>
              <!-- c7 green bounce from bottom -->
              <line x1="112" y1="32" x2="112" y2="48" stroke="#2d8c3c" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="107"   y="36" width="10" height="10" fill="#2d8c3c" rx="1"/>
              <!-- c8 green small with long lower wick -->
              <line x1="128" y1="26" x2="128" y2="42" stroke="#2d8c3c" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="123"   y="28" width="10" height="6"  fill="#2d8c3c" rx="1"/>
              <!-- c9 red rejection at top -->
              <line x1="144" y1="10" x2="144" y2="30" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="139"   y="14" width="10" height="14" fill="#c62828" rx="1"/>
            </svg>

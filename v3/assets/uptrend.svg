<svg role="img" aria-label="Illustrative uptrend candle sequence" viewBox="0 0 160 60" xmlns="http://www.w3.org/2000/svg">
              <!-- c1 green small, balanced wicks -->
              <line x1="16"  y1="43" x2="16"  y2="52" stroke="#2d8c3c" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="11"    y="46" width="10" height="4"  fill="#2d8c3c" rx="1"/>
              <!-- c2 green medium, long lower wick (support test) -->
              <line x1="32"  y1="36" x2="32"  y2="48" stroke="#2d8c3c" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="27"    y="38" width="10" height="6"  fill="#2d8c3c" rx="1"/>
              <!-- c3 red small pullback -->
              <line x1="48"  y1="35" x2="48"  y2="42" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="43"    y="36" width="10" height="4"  fill="#c62828" rx="1"/>
              <!-- c4 green big breakout -->
              <line x1="64"  y1="22" x2="64"  y2="40" stroke="#2d8c3c" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="59"    y="24" width="10" height="14" fill="#2d8c3c" rx="1"/>
              <!-- c5 red doji-like, long upper wick (failed rejection) -->
              <line x1="80"  y1="16" x2="80"  y2="28" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="75"    y="22" width="10" height="3"  fill="#c62828" rx="1"/>
              <!-- c6 green medium continuation -->
              <line x1="96"  y1="14" x2="96"  y2="25" stroke="#2d8c3c" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="91"    y="16" width="10" height="7"  fill="#2d8c3c" rx="1"/>
              <!-- c7 red small pullback -->
              <line x1="112" y1="12" x2="112" y2="20" stroke="#c62828" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="107"   y="14" width="10" height="4"  fill="#c62828" rx="1"/>
              <!-- c8 green strong push -->
              <line x1="128" y1="4"  x2="128" y2="18" stroke="#2d8c3c" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="123"   y="6"  width="10" height="10" fill="#2d8c3c" rx="1"/>
              <!-- c9 green with long upper wick (probing higher) -->
              <line x1="144" y1="2"  x2="144" y2="14" stroke="#2d8c3c" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="139"   y="4"  width="10" height="8"  fill="#2d8c3c" rx="1"/>
            </svg>
